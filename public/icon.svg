<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Halo / Aura -->
  <circle cx="256" cy="240" r="140" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Holy Fire Flames (Behind Cross) -->
  <path d="M256 90 C290 150 330 190 320 270 C310 330 270 360 256 370 C242 360 202 330 192 270 C182 190 222 150 256 90 Z" 
        fill="url(#fireGrad)" filter="url(#glow)" opacity="0.95"/>
  <path d="M256 140 C276 180 295 215 290 265 C284 305 264 325 256 332 C248 325 228 305 222 265 C217 215 236 180 256 140 Z" 
        fill="#FEF08A" opacity="0.9"/>

  <!-- Golden Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Beam -->
    <rect x="242" y="120" width="28" height="260" rx="6" fill="url(#goldGrad)"/>
    <!-- Horizontal Beam -->
    <rect x="160" y="190" width="192" height="28" rx="6" fill="url(#goldGrad)"/>
    <!-- Inner Cross Highlights -->
    <rect x="248" y="126" width="16" height="248" rx="3" fill="#FFFBEB" opacity="0.75"/>
    <rect x="166" y="196" width="180" height="16" rx="3" fill="#FFFBEB" opacity="0.75"/>
  </g>

  <!-- Crown / Star Accent on top -->
  <polygon points="256,60 262,75 278,78 266,90 269,106 256,98 243,106 246,90 234,78 250,75" fill="#FDE047"/>

  <!-- Bottom Accent Text / Monogram -->
  <text x="256" y="440" font-family="'Cinzel', serif, sans-serif" font-weight="800" font-size="28" fill="#FBBF24" text-anchor="middle" letter-spacing="4">FIRE GRACE</text>
  <text x="256" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="6">FELLOWSHIP</text>
</svg>
